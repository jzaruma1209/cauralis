<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cauralis · Logo animado</title>
<style>
  /* Archivo autónomo: la "C" y la hoja van incrustadas, con fondo transparente y sin brillos.
     Añade ?embed=1 a la URL para ocultar los botones. Entrada de ~2,3 s y luego movimiento suave continuo. */
  @property --ang { syntax: "<angle>"; inherits: false; initial-value: 0deg; }
  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: transparent; }
  body { display: grid; place-items: center; font-family: system-ui, sans-serif; }
  .escena { position: relative; width: min(100vw, 100svh); aspect-ratio: 1; background: transparent; }
  .logo, .capa { position: absolute; }
  .logo { inset: 0; }
  .capa img { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }

  /* La "C": se dibuja girando (máscara cónica) */
  .c { left: 21.944%; top: 16.481%; width: 47.593%; height: 48.889%; }
  .c .dibujo {
    position: absolute; inset: 0;
    -webkit-mask-image: conic-gradient(from 40deg at 49.2% 49.6%, transparent 0deg, transparent calc(360deg - var(--ang)), #000 calc(374deg - var(--ang)), #000 360deg);
            mask-image: conic-gradient(from 40deg at 49.2% 49.6%, transparent 0deg, transparent calc(360deg - var(--ang)), #000 calc(374deg - var(--ang)), #000 360deg);
  }

  /* La hoja: crece desde el tallo y luego se mece */
  .hoja { left: 47.593%; top: 16.019%; width: 25.278%; height: 15.833%; transform-origin: 0.0% 81.3%; }
  .hoja .entrada { position: absolute; inset: 0; transform-origin: 0.0% 81.3%; opacity: 0; }

  /* ── Reproducción ─────────────────────────────── */
  .reproduciendo .c { animation: c-entra 1.35s .1s cubic-bezier(.2, .8, .2, 1) both; }
  .reproduciendo .c .dibujo { animation: dibujar 1.35s .1s cubic-bezier(.65, 0, .35, 1) both; }
  .reproduciendo .hoja .entrada { animation: hoja-brota .9s 1.15s cubic-bezier(.3, 1.4, .5, 1) both; }
  .reproduciendo .hoja { animation: mecer 4.6s 2.1s ease-in-out infinite; }
  .reproduciendo .logo { animation: flotar 6.5s 2.3s ease-in-out infinite; }

  @keyframes dibujar { from { --ang: 0deg; } to { --ang: 380deg; } }
  @keyframes c-entra { from { opacity: 0; transform: scale(.94); filter: blur(6px); } 25% { opacity: 1; } to { opacity: 1; transform: none; filter: none; } }
  @keyframes hoja-brota {
    0% { opacity: 0; transform: scale(0) rotate(-40deg); }
    55% { opacity: 1; transform: scale(1.12) rotate(6deg); }
    78% { transform: scale(.97) rotate(-2deg); }
    100% { opacity: 1; transform: none; }
  }
  @keyframes mecer { 0%, 100% { transform: rotate(0deg); } 30% { transform: rotate(-3.5deg); } 70% { transform: rotate(2.5deg); } }
  @keyframes flotar { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-1.1%); } }

  .pausado .escena, .pausado .escena * { animation-play-state: paused !important; }

  nav { position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%); display: flex; gap: 10px; }
  button { background: #12191d; color: #fff; border: 1px solid #3b4a50; border-radius: 10px; padding: 10px 18px; font: 600 14px system-ui, sans-serif; cursor: pointer; }
  button:hover { background: #1b252a; }
  button:focus-visible { outline: 2px solid #00e890; outline-offset: 2px; }
  body.embed nav { display: none; }

  @media (prefers-reduced-motion: reduce) {
    .reproduciendo .escena, .reproduciendo .escena * { animation: none !important; }
    .hoja .entrada { opacity: 1; }
    .c .dibujo { -webkit-mask-image: none; mask-image: none; }
  }
</style>
</head>

<nav aria-label="Reproducción">
  <button id="repetir" type="button">Repetir</button>
  <button id="pausa" type="button" aria-pressed="false">Pausar</button>
</nav>
<script>
  const cuerpo = document.body;
  const repetir = () => {
    cuerpo.classList.remove("reproduciendo", "pausado");
    document.getElementById("pausa").textContent = "Pausar";
    void cuerpo.offsetWidth; // reinicia las animaciones CSS
    cuerpo.classList.add("reproduciendo");
  };
  document.getElementById("repetir").onclick = repetir;
  document.getElementById("pausa").onclick = (e) => {
    const p = cuerpo.classList.toggle("pausado");
    e.currentTarget.textContent = p ? "Reanudar" : "Pausar";
    e.currentTarget.setAttribute("aria-pressed", String(p));
  };
  if (new URLSearchParams(location.search).get("embed") === "1") cuerpo.classList.add("embed");
  Promise.all([...document.images].map((i) => i.decode().catch(() => {}))).then(repetir);
</script>
